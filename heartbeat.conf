# Edit these for each long job.

# Log the job writes to. Its last line is shown as "last finished step".
RUNLOG=/path/to/project/run.log

# Result files. Lines starting with PASS or FAIL are counted. Leave unquoted globs as they are.
RESULTS="/path/to/project/results/*.log"

# Progress log that heartbeat.sh appends to (newest line at the bottom).
PROGRESS=/path/to/project/PROGRESS.md

# Pattern (grep -E) matching the job's running processes in "ps -eo args". Start it with ^.
PROCS="^node "

# Text the job writes to RUNLOG when it has finished. heartbeat.sh stops when it sees it.
DONE="ALL DONE"

# Seconds between progress log lines.
EVERY=300
